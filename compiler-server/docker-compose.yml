services:
  amxx-compiler:
    build: .
    container_name: cs16-amxx-compiler
    restart: unless-stopped
    ports:
      - "8080:8080"
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=8080
      - AMXX_BASE_DIR=/opt/amxx
      - MAX_SOURCE_BYTES=524288
      - COMPILE_TIMEOUT_MS=15000
      # Opcional: descomenta para requerir token Bearer desde la app
      # - COMPILER_API_TOKEN=cambia_este_token_seguro
